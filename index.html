<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrew Russell</title>
    <meta name="description" content="Andrew Russell – personal site and CV" />

    <!-- Typography options (we'll switch between these via CSS variables) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Source+Sans+3:wght@300;400;600&family=Inter:wght@300;400;500;600&family=Fraunces:wght@400;500;600&family=Spectral:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@400;500;600&family=DM+Serif+Display&family=EB+Garamond:wght@400;500;600&family=Bodoni+Moda:wght@400;500;600&family=Manrope:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&family=Work+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"

    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />

    <!--
      React + in-browser Babel via CDN (no bundler).
      IMPORTANT: keep these versions PINNED. Babel must stay on 7.x — Babel 8
      changed preset-react's default JSX runtime to "automatic", which injects an
      `import` statement that breaks this non-module inline script and renders the
      page blank. Do not change to an unpinned/`@latest` URL.
    -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
      const PALETTES = [

          values: {

      const HEADING_FONTS = [

        {

        },
        {
          id: 'plex-serif',
          name: 'IBM Plex Serif',
          description: 'Rational serif with a technical heritage.',
          css: '"IBM Plex Serif", "Iowan Old Style", "Georgia", serif',
        },
        {
          id: 'playfair',
          name: 'Playfair Display',
          description: 'High-contrast display serif, common on editorial/art sites.',

        {

          name: 'DM Serif Display',
          description: 'Elegant, sculpted serif often used for branding.',
          css: '"DM Serif Display", "Iowan Old Style", "Georgia", serif',
        },
        {
          id: 'eb-garamond',
          name: 'EB Garamond',
          description: 'Classic Garamond for a literary, bookish tone.',
          css: '"EB Garamond", "Iowan Old Style", "Georgia", serif',
        },
        {
          id: 'bodoni-moda',
          name: 'Bodoni Moda',
          description: 'Modern Bodoni revival – strong, fashion-adjacent display.',
          css: '"Bodoni Moda", "Didot", "Bodoni MT", serif',
        },
        {

          name: 'Cormorant Garamond',
          description: 'Bookish, high-contrast serif for a more literary feel.',
          css: '"Cormorant Garamond", "Iowan Old Style", "Georgia", serif',
        },
        {
          id: 'space-grotesk',
          name: 'Space Grotesk',

          css: '"Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        },
      ];

      const BODY_FONTS = [
        {
          id: 'plex-sans',
          name: 'IBM Plex Sans',
          description: 'Workhorse sans with a subtle technical flavor.',
          css: '"IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        },
        {
          id: 'inter',
          name: 'Inter',
          description: 'Neutral, modern, very readable.',
          css: '"Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        },
        {
          id: 'source-sans',
          name: 'Source Sans 3',
          description: 'Warm, editorial sans that still feels precise.',
          css: '"Source Sans 3", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        },
        {
          id: 'manrope',
          name: 'Manrope',
          description: 'Geometric sans popular in contemporary product and studio sites.',
          css: '"Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        },
        {
          id: 'dm-sans',
          name: 'DM Sans',
          description: 'Soft, rounded sans with a calm, contemporary feel.',
          css: '"DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        },
        {
          id: 'work-sans',
          name: 'Work Sans',
          description: 'Versatile sans often used for creative studio and portfolio sites.',
          css: '"Work Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        },
      ];

      const MONO_FONT =
        '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace';

      const SNAPSHOT_KEYS = [
        {
          id: 'africa',
          label: 'Africa',
          emoji: '🌍',
          icon: './assets/africa-32.png',
          iconSrcSet: './assets/africa-32.png 32w, ./assets/africa-64.png 64w',
          iconSizes: '28px',
          iconAlt: 'Outline of the African continent',
          tooltip:
            '4 years developing agri-fintech products for smallholder farmers in sub-Saharan Africa.',
        },
        {
          id: 'google',
          label: 'Google',
          emoji: '🔍',
          icon: './assets/google-32.png',
          iconSrcSet: './assets/google-32.png 32w, ./assets/google-64.png 64w',
          iconSizes: '28px',
          iconAlt: 'Google logo icon',
          tooltip: '~6 years across software engineering roles at Google, Microsoft, and others. Focus on security and privacy systems.',
        },
        {
          id: 'cryptography',
          label: 'Cryptography',
          emoji: '🔐',
          icon: './assets/cryptography-32.png',
          iconSrcSet: './assets/cryptography-32.png 32w, ./assets/cryptography-64.png 64w',
          iconSizes: '28px',
          iconAlt: 'Cryptography diagram icon',
          tooltip:
            '2 years in UT Austin’s CS PhD program studying cryptography. Published at CRYPTO 2018.',
        },
        {
          id: 'windmill',
          label: 'Netherlands',
          emoji: '🌬️',
          icon: './assets/windmill-32.png',
          iconSrcSet: './assets/windmill-32.png 32w, ./assets/windmill-64.png 64w',
          iconSizes: '28px',
          iconAlt: 'Windmill icon',
          tooltip:
            'Currently based out of Amsterdam; willing & able to work in the EU, US, and Kenya.',
        },
        {
          id: 'art',
          label: 'Art',
          emoji: '🎨',
          icon: './assets/art-32.png',
          iconSrcSet: './assets/art-32.png 32w, ./assets/art-64.png 64w',
          iconSizes: '28px',
          iconAlt: 'Art icon',
          tooltip:
            'Generative and conceptual art projects exploring AI, memory, and autonomy.',
        },
        {
          id: 'running',
          label: 'Running',
          emoji: '🏃',
          icon: './assets/running-32.png',
          iconSrcSet: './assets/running-32.png 32w, ./assets/running-64.png 64w',
          iconSizes: '28px',
          iconAlt: 'Running figure icon',
          tooltip:
            'Ultramarathoner and top 15% worldwide Hyrox athlete.',
        },
        {
          id: 'violin',
          label: 'Violin',
          emoji: '🎻',
          icon: './assets/violin-32.png',
          iconSrcSet: './assets/violin-32.png 32w, ./assets/violin-64.png 64w',
          iconSizes: '28px',
          iconAlt: 'Violin icon',
          tooltip:
            '15+ years studying classical violin.',
        },
      ];

      function App() {
        const [paletteId, setPaletteId] = React.useState('studio-light');
        const [headingFontId, setHeadingFontId] = React.useState('dm-serif-display');
        const [bodyFontId, setBodyFontId] = React.useState('plex-sans');
        const [hoveredKeyId, setHoveredKeyId] = React.useState(null);
        const [tooltipPosition, setTooltipPosition] = React.useState({ x: 0, y: 0 });

        // Close tooltip when clicking outside
        React.useEffect(() => {
          const handleClickOutside = (e) => {
            if (hoveredKeyId && !e.target.closest('.snapshot-key')) {
              setHoveredKeyId(null);
            }
          };
          document.addEventListener('click', handleClickOutside);
          return () => document.removeEventListener('click', handleClickOutside);
        }, [hoveredKeyId]);

        const palette = React.useMemo(
          () => PALETTES.find((p) => p.id === paletteId) || PALETTES[0],
          [paletteId]
        );

        const headingFont = React.useMemo(
          () => HEADING_FONTS.find((f) => f.id === headingFontId) || HEADING_FONTS[0],
          [headingFontId]
        );

        const bodyFont = React.useMemo(
          () => BODY_FONTS.find((f) => f.id === bodyFontId) || BODY_FONTS[0],
          [bodyFontId]
        );

        React.useEffect(() => {
          const root = document.documentElement;
          const vars = {
            '--bg': palette.values.bg,
            '--bg-elevated': palette.values.surface,
            '--bg-elevated-alt': palette.values.surfaceAlt,
            '--keycap': palette.values.keycap,
            '--text-main': palette.values.text,
            '--text-muted': palette.values.textMuted,
            '--accent': palette.values.accent,
            '--accent-soft': palette.values.accentSoft,
            '--accent-strong': palette.values.accentStrong,
            '--border-subtle': palette.values.border,
            '--font-body': bodyFont.css,
            '--font-heading': headingFont.css,
            '--font-mono': MONO_FONT,
          };

          Object.entries(vars).forEach(([key, value]) => {
            root.style.setProperty(key, value);
          });
        }, [palette, headingFont, bodyFont]);

        const hoveredKey = React.useMemo(
          () => SNAPSHOT_KEYS.find((item) => item.id === hoveredKeyId) || null,
          [hoveredKeyId]
        );

        const tooltipStyle = React.useMemo(() => {
          if (!hoveredKey) return { visibility: 'hidden', opacity: 0 };
          const padding = 12;
          const tooltipWidth = 260;
          const tooltipHeight = 80;
          const viewportWidth = window.innerWidth || 0;
          const viewportHeight = window.innerHeight || 0;

          let x = tooltipPosition.x + 14;
          let y = tooltipPosition.y + 18;

          if (x + tooltipWidth + padding > viewportWidth) {
            x = viewportWidth - tooltipWidth - padding;
          }
          if (x < padding) x = padding;

          if (y + tooltipHeight + padding > viewportHeight) {
            y = tooltipPosition.y - tooltipHeight - 18;
          }
          if (y < padding) y = padding;

          return {
            visibility: 'visible',
            opacity: 1,
            left: `${x}px`,
            top: `${y}px`,
          };
        }, [hoveredKey, tooltipPosition]);

        return (
          <div className="app-shell link-style-quiet">
            <header className="top-bar">
              <div className="top-bar-inner">
                <div className="brand">
                  <div className="brand-mark" aria-hidden="true">AR</div>
                  <div className="brand-text">
                    <div className="brand-name">Andrew Russell</div>
                    <div className="brand-subtitle">
                      Ex-Google, Microsoft — tech, product, data, operations, emerging markets 
                    </div>
                  </div>
                </div>

                <div className="toggles" aria-label="Design controls">
                  <div className="toggle-group">
                    <label htmlFor="palette-select">Palette</label>
                    <select
                      id="palette-select"
                      value={paletteId}
                      onChange={(e) => setPaletteId(e.target.value)}
                    >
                      {PALETTES.map((p) => (
                        <option key={p.id} value={p.id}>
                          {p.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="toggle-group">
                    <label htmlFor="heading-font-select">Headings</label>
                    <select
                      id="heading-font-select"
                      value={headingFontId}
                      onChange={(e) => setHeadingFontId(e.target.value)}
                    >
                      {HEADING_FONTS.map((f) => (
                        <option key={f.id} value={f.id}>
                          {f.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="toggle-group">
                    <label htmlFor="body-font-select">Body text</label>
                    <select
                      id="body-font-select"
                      value={bodyFontId}
                      onChange={(e) => setBodyFontId(e.target.value)}
                    >
                      {BODY_FONTS.map((f) => (
                        <option key={f.id} value={f.id}>
                          {f.name}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>
            </header>

            <main className="page">
              <section className="hero" aria-labelledby="hero-title">
                <div className="hero-main">
                  <h1 id="hero-title">A little bit about me</h1>
                  <p className="hero-lede">
                    I've spent the last 5 years living between Amsterdam and Nairobi working on an agri-fintech startup. Mostly, I like being outside and being active.
                    I'm currently on sabbatical and on the road — a solo motorbike expedition from Nairobi to Namibia — returning to work in December 2026.
                   <br />
                   <br />
                    Professionally, my career has been a slow arc toward using technology to improve the lives of real people: I started in the ivory tower proving cryptographic theorems,
                    moved to industry to ship software at Google and Microsoft, and ended up working with some of the least technologically connected people in the world — smallholder
                    farmers in rural Kenya and Zambia. Wherever I've worked, I think adversarially: proving a cryptographic property holds, or trying to prove myself wrong with data and
                    field research before the market does it for me. I'll work at any point on the abstraction spectrum as long as the impact is tangible. Right now that points at AI:
                    making it safe &amp; useful in real ways.
                  </p>
                  <div className="hero-actions">
                    <a href="#about" className="button-primary">About &amp; CV</a>
                    <a href="#contact" className="button-secondary">Get in touch</a>
                  </div>
                </div>

                <aside className="hero-aside" aria-label="Snapshot">
                  <div className="card key-stats">
                    <div className="key-stats-body">
                      <div className="headshot-wrap">
                        <img
                          src="./assets/headshot-400.jpg"
                          srcSet="./assets/headshot-200.jpg 200w, ./assets/headshot-400.jpg 400w, ./assets/headshot-600.jpg 600w"
                          sizes="(max-width: 900px) 60vw, 195px"
                          alt="Portrait illustration of Andrew Russell"
                          className="headshot-image"
                          loading="eager"
                          decoding="async"
                          fetchpriority="high"
                        />
                      </div>
                      <div className="snapshot-rows" aria-label="Snapshot overview">
                        <div className="snapshot-row snapshot-row--top">
                          {SNAPSHOT_KEYS.slice(0, 4).map((item) => (
                            <button
                              key={item.id}
                              type="button"
                              className="snapshot-key"
                              onMouseEnter={() => setHoveredKeyId(item.id)}
                              onMouseLeave={() => setHoveredKeyId(null)}
                              onMouseMove={(e) =>
                                setTooltipPosition({ x: e.clientX, y: e.clientY })
                              }
                              onPointerUp={(e) => {
                                if (e.pointerType === 'touch') {
                                  e.stopPropagation();
                                  setHoveredKeyId(hoveredKeyId === item.id ? null : item.id);
                                  const rect = e.currentTarget.getBoundingClientRect();
                                  setTooltipPosition({ x: rect.left + rect.width / 2, y: rect.bottom });
                                }
                              }}
                              onFocus={() => setHoveredKeyId(item.id)}
                              onBlur={() => setHoveredKeyId(null)}
                            >
                              <span className="snapshot-emoji" aria-hidden="true">
                                {item.icon ? (
                                  <img
                                    src={item.icon}
                                    srcSet={item.iconSrcSet}
                                    sizes={item.iconSizes}
                                    alt={item.iconAlt}
                                    className="snapshot-image"
                                    loading="lazy"
                                    decoding="async"
                                  />
                                ) : (
                                  item.emoji
                                )}
                              </span>
                              <span className="sr-only">{item.label}</span>
                            </button>
                          ))}
                        </div>
                        <div className="snapshot-row snapshot-row--bottom">
                          {SNAPSHOT_KEYS.slice(4).map((item) => (
                            <button
                              key={item.id}
                              type="button"
                              className="snapshot-key"
                              onMouseEnter={() => setHoveredKeyId(item.id)}
                              onMouseLeave={() => setHoveredKeyId(null)}
                              onMouseMove={(e) =>
                                setTooltipPosition({ x: e.clientX, y: e.clientY })
                              }
                              onPointerUp={(e) => {
                                if (e.pointerType === 'touch') {
                                  e.stopPropagation();
                                  setHoveredKeyId(hoveredKeyId === item.id ? null : item.id);
                                  const rect = e.currentTarget.getBoundingClientRect();
                                  setTooltipPosition({ x: rect.left + rect.width / 2, y: rect.bottom });
                                }
                              }}
                              onFocus={() => setHoveredKeyId(item.id)}
                              onBlur={() => setHoveredKeyId(null)}
                            >
                              <span className="snapshot-emoji" aria-hidden="true">
                                {item.icon ? (
                                  <img
                                    src={item.icon}
                                    srcSet={item.iconSrcSet}
                                    sizes={item.iconSizes}
                                    alt={item.iconAlt}
                                    className="snapshot-image"
                                    loading="lazy"
                                    decoding="async"
                                  />
                                ) : (
                                  item.emoji
                                )}
                              </span>
                              <span className="sr-only">{item.label}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                      <p className="snapshot-hint">Tap icons for details</p>
                    </div>
                  </div>
                </aside>
              </section>

              <section id="about" className="section" aria-labelledby="about-heading">
                <div className="section-header">
                  <h2 id="about-heading">Work</h2>
                  <p className="section-kicker"></p>
                </div>

                <div className="section-grid">
                  <article className="card">
                    <h3 className="card-title">How I work</h3>
                    <p>
                      I tend to sit at the intersection of product, tech, data, and operations: translating between field realities,
                      commercial constraints, and what is technically possible.
                    </p>
                    <p className="compact-intro">
                      I am comfortable:
                    </p>
                    <ul className="simple-list">
                      <li>Owning a P&amp;L</li>
                      <li>Managing people</li>
                      <li>Leading cross-functional teams</li>
                      <li>Building &amp; scaling technical systems myself or with engineers (without "throwing specs over the wall")</li>
                      <li>Building with LLMs and agents hands-on — from prompt-injection-resistant architectures to shipped consumer apps</li>
                      <li>Turning fuzzy questions into evals, experiments, and feedback loops</li>
                      <li>Spending weeks with customers, field staff, and raw data to understand what is actually going on</li>
                      <li>Digesting complex new domains (e.g. academic literature)</li>
                    </ul>
                  </article>

                  <article className="card card--cv-highlights">
                    <a
                      href="./Andrew_Russell_CV_2026.pdf"
                      className="download-key"
                      aria-label="Open CV in a new tab"
                      target="_blank"
                      rel="noopener"
                    >
                      <img
                        src="./assets/download-24.png"
                        srcSet="./assets/download-24.png 24w, ./assets/download-48.png 48w"
                        sizes="22px"
                        alt="Download icon"
                        className="download-key-image"
                        loading="lazy"
                        decoding="async"
                      />
                      <span className="download-key-label">CV</span>
                    </a>
                    <h3 className="card-title">CV Highlights</h3>
                    <ul className="role-list">
                      <li>
                        <div className="role-heading">
                          <span className="role-title">Emerging market agri-fintech startup</span>
                          <span className="role-org">Head of Data &amp; Senior Product Manager</span>
                        </div>
                        <div className="role-meta">2021 – 2025 · Amsterdam / Nairobi / Lusaka</div>
                        <p className="role-body">
                          Scaled a data org. Helped define two company-wide strategic pivots with market research. Led a $10m revenue business unit in Zambia.
                        </p>
                      </li>
                      <li>
                        <div className="role-heading">
                          <span className="role-title">Software engineer &amp; cryptographer</span>
                          <span className="role-org">Google, Microsoft, UT Austin</span>
                        </div>
                        <div className="role-meta">2013 – 2021</div>
                        <p className="role-body">
                          Shipped security and privacy technology impacting billions. Published peer-reviewed cryptography
                          research.
                        </p>
                      </li>
                    </ul>
                  </article>

                </div>
              </section>

              <section id="cv" className="section" aria-labelledby="cv-heading">
                <div className="section-header">
                  <h2 id="cv-heading">Art, Projects, &amp; Writing</h2>
                  <p className="section-kicker"></p>
                </div>

                <div className="cv-grid">
                  <article className="cv-column project-card">
                    <a href="https://thehumanfund.ai" className="project-card-link" target="_blank" rel="noopener" aria-label="Costanza – The Human Fund">
                      <img
                        src="./assets/costanza-w70.png"
                        srcSet="./assets/costanza-w70.png 70w, ./assets/costanza-w140.png 140w"
                        sizes="70px"
                        alt="Costanza character illustration"
                        className="project-card-image"
                        loading="lazy"
                        decoding="async"
                      />
                    </a>
